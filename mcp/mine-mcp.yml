notes: >-
  MineOS publishes an official hosted/remote MCP server. Every endpoint documented in the
  API reference is exposed as an MCP tool, plus a documentation-search capability so agents
  can discover endpoint functionality. Typically wired into a client via the mcp-remote
  wrapper. Tool surface mirrors the OpenAPI operations in openapi/mine-openapi-original.json
  (tickets/privacy requests, data-source systems, assessments, employees, AI agent/device
  discovery, and webhook management).
