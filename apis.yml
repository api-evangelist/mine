aid: mine
name: MINE
description: >-
  Mine (MineOS) is a data privacy, governance, and AI security posture management
  platform backed by Battery Ventures. Its MineOS product automates data mapping and
  inventory, data subject / privacy rights requests (DSR), consent management, vendor
  and third-party risk (TPRM) assessments, and AI governance (AISPM) for enterprises,
  while the MineApp helps individuals reclaim their personal data. The MineOS public API
  (OpenAPI 3.0.1, API-key Bearer auth, EU + US datacenter endpoints) exposes tickets /
  privacy requests, data-source systems, assessments and templates, employees and
  business units, AI agent and device discovery, and webhook subscriptions, plus a
  hosted remote MCP server for agent access.
